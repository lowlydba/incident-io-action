name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - uses: lowlydba/sustainable-npm@v3

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Typecheck
        id: npm-typecheck
        run: npm run typecheck

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: End-to-End Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Send Firing Alert
        id: test-firing
        uses: ./
        with:
          incident-io-token: ${{ secrets.INCIDENT_IO_TOKEN }}
          alert-source-config-id: '01K77NXDEHQPQAN0Y0A1600D1N'
          title: 'CI Test Alert - Firing'
          status: 'firing'
          description: |
            ## CI End-to-End Test Alert

            This is an automated test alert from the CI workflow.

            **Workflow Run:** ${{ github.run_id }}
            **Event:** ${{ github.event_name }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
          metadata: |
            {
              "test": true,
              "ci": true,
              "workflow_run_id": "${{ github.run_id }}"
            }

      - name: Verify Firing Alert Success
        env:
          DEDUP_KEY: ${{ steps.test-firing.outputs.deduplication-key }}
          RESPONSE_STATUS: ${{ steps.test-firing.outputs.response-status }}
        run: |
          test -n "$DEDUP_KEY" || { echo "::error::deduplication-key output is empty"; exit 1; }
          test -n "$RESPONSE_STATUS" || { echo "::error::response-status output is empty"; exit 1; }
          echo "✅ Firing alert sent successfully!"
          echo "Deduplication Key: $DEDUP_KEY"
          echo "Response Status: $RESPONSE_STATUS"

      - name: Wait Before Resolving
        run: sleep 5

      - name: Send Resolved Alert
        id: test-resolved
        uses: ./
        with:
          incident-io-token: ${{ secrets.INCIDENT_IO_TOKEN }}
          alert-source-config-id: '01K77NXDEHQPQAN0Y0A1600D1N'
          title: 'CI Test Alert - Resolved'
          status: 'resolved'
          description: 'CI test alert has been resolved.'
          deduplication-key: ${{ steps.test-firing.outputs.deduplication-key }}

      - name: Verify Resolved Alert Success
        env:
          FIRING_KEY: ${{ steps.test-firing.outputs.deduplication-key }}
          DEDUP_KEY: ${{ steps.test-resolved.outputs.deduplication-key }}
          RESPONSE_STATUS: ${{ steps.test-resolved.outputs.response-status }}
        run: |
          test -n "$DEDUP_KEY" || { echo "::error::deduplication-key output is empty"; exit 1; }
          test -n "$RESPONSE_STATUS" || { echo "::error::response-status output is empty"; exit 1; }
          if [ "$DEDUP_KEY" != "$FIRING_KEY" ]; then
            echo "::error::resolved dedup key ($DEDUP_KEY) does not match firing dedup key ($FIRING_KEY)"
            exit 1
          fi
          echo "✅ Resolved alert sent successfully!"
          echo "Deduplication Key: $DEDUP_KEY"
          echo "Response Status: $RESPONSE_STATUS"

      - name: Send Alert With Invalid Status
        id: test-invalid-status
        uses: ./
        continue-on-error: true
        with:
          incident-io-token: ${{ secrets.INCIDENT_IO_TOKEN }}
          alert-source-config-id: '01K77NXDEHQPQAN0Y0A1600D1N'
          title: 'CI Test Alert - Invalid Status'
          status: 'bogus'

      - name: Verify Invalid Status Fails
        env:
          OUTCOME: ${{ steps.test-invalid-status.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::invalid status was accepted (outcome: $OUTCOME)"
            exit 1
          fi
          echo "✅ Invalid status rejected as expected"

  test-action-without-secrets:
    name: Test Without Secrets (Dry Run)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      # No secrets on fork PRs, but input validation fails before any API
      # call, so this still proves the bundle loads and runs on node24.
      - name: Run Bundle With Invalid Status
        id: test-bundle
        uses: ./
        continue-on-error: true
        with:
          incident-io-token: 'dummy-token'
          alert-source-config-id: 'dummy-config-id'
          title: 'CI Dry Run - Invalid Status'
          status: 'bogus'

      - name: Verify Bundle Fails Cleanly
        env:
          OUTCOME: ${{ steps.test-bundle.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::invalid status was accepted (outcome: $OUTCOME)"
            exit 1
          fi
          echo "✅ Bundle executed and rejected invalid input as expected"
          echo "ℹ️ Full E2E tests run after merge to the main repository"

  all-good:
    name: All Tests Pass
    runs-on: ubuntu-slim
    needs: [test-typescript, test-action, test-action-without-secrets]
    if: always()

    steps:
      - name: Check all job results
        uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
        with:
          jobs: ${{ toJSON(needs) }}
